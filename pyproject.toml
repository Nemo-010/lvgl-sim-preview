[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lvgl-preview"
version = "0.1.0"
description = "Preview Zephyr LVGL applications on the desktop"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[project.scripts]
lvgl-preview = "lvgl_preview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
