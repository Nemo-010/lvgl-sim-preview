# SPDX-License-Identifier: Apache-2.0

CONFIG_LVGL=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_LOG=y
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_FONT_DEFAULT_UNSCII_8=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768

CONFIG_DISPLAY=y
CONFIG_INPUT=y
CONFIG_GPIO=y

CONFIG_MAIN_STACK_SIZE=8192

# 1bpp, because the target panel is a monochrome OLED. This is what the example
# repo does, and what makes LVGL render into the I1 format the panel wants.
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_FULL_REFRESH=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768
