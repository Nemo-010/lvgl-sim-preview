CONFIG_LVGL=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_LOG=y
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_FONT_DEFAULT_UNSCII_8=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768

CONFIG_DISPLAY=y
CONFIG_INPUT=y
CONFIG_GPIO=y

CONFIG_MAIN_STACK_SIZE=8192

# Note: no colour depth is set here on purpose. It depends on the panel, so the
# preview derives it from the target board's devicetree, and a real project sets
# it in Kconfig.defconfig next to the panel it targets.

# Full refresh with a full-size buffer. This is the layout a monochrome OLED
# application wants, and it also makes partial-refresh corner cases in the
# preview easy to reason about: every flush carries a whole frame.
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_FULL_REFRESH=y
